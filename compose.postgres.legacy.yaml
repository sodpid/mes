name: mes-local
services:
  db:
    image: public.ecr.aws/docker/library/postgres:17
    environment:
      POSTGRES_USER: mes
      POSTGRES_DB: mes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先配置.env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - mes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 2s
      retries: 30
volumes:
  mes_pgdata:
