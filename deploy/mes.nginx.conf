server {
    listen 80;
    server_name mes.xiaomtech.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/mes-acme; default_type text/plain; }
    location / { return 301 https://mes.xiaomtech.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name mes.xiaomtech.cn;
    ssl_certificate /etc/letsencrypt/live/mes.xiaomtech.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mes.xiaomtech.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/mes-acme; default_type text/plain; }
    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
